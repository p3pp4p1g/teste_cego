name: snapshot vote results

on:
  push:
    paths-ignore:
      - resultados.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read counters and write resultados.txt
        shell: bash
        run: |
          set -euo pipefail
          NS='teste-cego-velomax-2026'
          read_count() {
            key="$1"
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
              "https://counterapi.com/api/${NS}/vote/${key}?behavior=vote&readOnly=true" \
              | jq -r '.value // 0'
          }

          {
            echo "RESULTADOS - TESTE CEGO VELOMAX"
            echo "Atualizado em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            for n in 1 2 3 4; do
              a=$(read_count "cena-${n}-a")
              b=$(read_count "cena-${n}-b")
              total=$((a+b))
              if [ "$total" -gt 0 ]; then
                pa=$((100*a/total))
                pb=$((100*b/total))
              else
                pa=0
                pb=0
              fi
              echo "Cena ${n}: A=${a} (${pa}%) | B=${b} (${pb}%) | Total=${total}"
            done
          } > resultados.txt

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update vote results snapshot"
          git push
